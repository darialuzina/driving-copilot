# Driving Copilot — golden eval set.
# Router cases from spec §10 (v1.7) plus end-to-end assertions.
# The runner (3 rolls per question, router accuracy table) is Phase 5; this file
# lives in the repo from Phase 1 per ai.md and grows from real traffic.
#
# Schema:
#   router:        message -> expected single label
#   end_to_end:    message + fixture + must_contain / must_not_contain assertions
#                  optional reply_language (English|Russian): the runner asserts the
#                  answer's Cyrillic ratio matches the REPLY IN directive (DRIVE-7).
#   backfill:      run against the section 11 backfill fixture

version: 1

router:
  - message: "when is my next lesson?"
    expect: lookup
  - message: "когда у меня следующий урок?"
    expect: lookup
  # --- DRIVE-8: notes-by-date phrasings route to lookup, not other (week-one misroute) ---
  - message: "what are my notes from 13/08?"
    expect: lookup
  - message: "what did I write on 2026-08-13?"
    expect: lookup
  - message: "покажи мои записи за 13 августа"
    expect: lookup
  - message: "how is my parking?"
    expect: analytics
  - message: "how did my rotondes go?"           # Dutch term embedded in English
    expect: analytics
  - message: "today we practiced merging, went fine"
    expect: log
  - message: "сегодня делали bijzondere verrichtingen, нормально"  # Dutch term embedded in Russian
    expect: log
  - message: "what do they check in the exam?"
    expect: docs
  - message: "what is the default speed limit on a motorway?"   # traffic-law -> docs (general-knowledge provenance path)
    expect: docs
  - message: "какое ограничение скорости на трассе?"
    expect: docs
  - message: "hi!"
    expect: smalltalk
  - message: "what tires should I buy?"
    expect: other
  - message: "book me a lesson tomorrow"
    expect: other
  # --- DRIVE-5: manual lesson management routes to `log` (the only write-allowing label) ---
  - message: "i have a lesson next tuesday 15:00 with marco"   # record a booking
    expect: log
  - message: "у меня урок в следующий вторник в 15:00 с marco"
    expect: log
  - message: "cancel my lesson on friday"                      # cancel a recorded booking
    expect: log
  - message: "отмени мой урок в пятницу"
    expect: log
  # --- DRIVE-5b: relative-date expressions route to `log` (record/log a lesson) ---
  - message: "урок во вторник 18 августа в 15:00 с Marco"      # bug case (a): weekday+day+month, no year
    expect: log
  - message: "i had lesson yestrday"                           # bug case (b): relative past, typo
    expect: log
  - message: "next friday i have a lesson with marco"          # relative future weekday
    expect: log
  - message: "урок в следующую пятницу в 14:00"
    expect: log
  # --- DRIVE-7: trial lesson / exam booking routes to log (add_lesson lesson_type) ---
  - message: "i have a trial lesson next tuesday 15:00 with marco"   # proefles
    expect: log
  - message: "my practical exam is on 2026-09-10 at 09:00"           # exam
    expect: log

end_to_end:
  - name: weak_areas_names_evidence_only
    message: "what are my weak areas?"
    fixture: backfill
    must_contain:
      - "roundabouts"
      - "speed adaptation"
    must_not_contain:
      - "parking"          # no evidence for parking in the backfill
  - name: next_lesson_empty_db_honest
    message: "when is my next lesson?"
    fixture: empty_db
    must_contain:
      - "no"
    must_not_contain:
      - "2026"            # must not invent a date
  - name: clutch_improvement_with_dates
    message: "how is my clutch?"
    fixture: backfill
    must_contain:
      - "2026-08-06"      # latest = good, cite the date
    must_not_contain: []
  - name: instructor_is_desevio
    message: "who is my instructor?"
    fixture: backfill
    must_contain:
      - "Desevio"
    must_not_contain: []
  # --- Phase 2 docs / provenance (spec section 9 acceptance) ---
  - name: docs_kb_cites_rijprocedure_section
    message: "can I fail for stalling?"
    fixture: empty_db
    route: docs
    must_contain:
      - "Rijprocedure B"
    must_not_contain: []
  - name: docs_kb_miss_uses_live_fallback_label
    message: "how much does the practical exam cost?"
    fixture: empty_db
    route: docs
    must_contain:
      - "from cbr.nl just now"
    must_not_contain: []
  - name: docs_general_knowledge_label
    message: "what is the default speed limit on a motorway in the Netherlands?"
    fixture: empty_db
    route: docs
    must_contain:
      - "not from the CBR docs"
    must_not_contain: []
  # --- DRIVE-5: manual lesson management + usability fixes ---
  - name: add_lesson_visible_in_next_lessons
    message: "I have a lesson on 2026-08-20 at 15:00 with Marco"
    fixture: empty_db
    route: log
    must_contain:
      - "2026-08-20"
      - "Marco"
    must_not_contain: []
  - name: pace_no_exam_date_verdict
    message: "am I on track?"
    fixture: backfill
    route: analytics
    must_contain:
      - "no exam date"
    must_not_contain:
      - "off track"
      - "Let me know"
      - "Would you like"
      - "Should I"
      - "Want me to"
  # --- DRIVE-5b: relative-date resolution + tool date validation ---
  # These cases assume the eval runner freezes the clock at 2026-08-10 (Monday),
  # so "tuesday 18 august" resolves to the future date 2026-08-18 (a Tuesday).
  - name: relative_date_tuesday_resolves_to_future
    message: "урок во вторник 18 августа в 15:00 с Marco"
    fixture: empty_db
    route: log
    must_contain:
      - "2026-08-18"
      - "Marco"
    must_not_contain:
      - "2025"            # must not guess the wrong year
  - name: add_lesson_past_date_rejected
    message: "book me a lesson on 2020-01-01 at 15:00"
    fixture: empty_db
    route: log
    must_contain:
      - "past"
    must_not_contain: []
  - name: log_lesson_future_date_rejected
    message: "i had a lesson on 2099-12-31, parking went great"
    fixture: empty_db
    route: log
    must_contain:
      - "future"
    must_not_contain: []
  - name: clarification_asks_to_resend_full_request
    message: "book me a lesson"
    fixture: empty_db
    route: log
    must_contain:
      - "one message"
    must_not_contain:
      - "which date"
      - "what time"
  # --- DRIVE-7: add_lesson lesson_type (proefles / exam) ---
  - name: add_lesson_trial_lesson_records_proefles
    message: "I have a trial lesson on 2026-08-20 at 15:00 with Marco"
    fixture: empty_db
    route: log
    must_contain:
      - "2026-08-20"
      - "proefles"
    must_not_contain: []
  - name: add_lesson_exam_records_exam_type
    message: "my practical exam is on 2026-09-10 at 09:00"
    fixture: empty_db
    route: log
    must_contain:
      - "2026-09-10"
      - "exam"
    must_not_contain: []
  # --- DRIVE-7: language enforcement (REPLY IN directive + guardrail) ---
  # The runner seeds Russian notes into the context for the English-question case so
  # the drift bug (answer follows the tool-result language instead of the user's) is
  # exercised. reply_language asserts the answer's Cyrillic ratio matches the directive.
  - name: english_question_over_russian_notes_stays_english
    message: "what are my weak areas?"
    fixture: backfill_russian_notes
    route: analytics
    reply_language: English
    must_contain:
      - "roundabouts"
    must_not_contain: []   # the reply_language assertion covers the Russian-drift check
  - name: russian_question_over_english_notes_stays_russian
    message: "какие у меня слабые места?"
    fixture: backfill
    route: analytics
    reply_language: Russian
    must_contain:
      - "rotondes"         # Dutch term / skill name may appear embedded
    must_not_contain: []
  # --- DRIVE-9: today-boundary in lesson history ---
  # history = date <= today; a same-day completed lesson is history. The runner
  # seeds a completed session dated "today" with a parking note, then asks for
  # today's notes. Before DRIVE-9, date < today excluded the same-day completed
  # lesson so the answer was "no lesson recorded" while gap analysis saw the note.
  - name: notes_from_today_over_same_day_completed
    message: "what are my notes from today?"
    fixture: today_completed_session
    route: lookup
    must_contain:
      - "parking"
    must_not_contain:
      - "no lesson recorded"
      - "no lessons yet"
